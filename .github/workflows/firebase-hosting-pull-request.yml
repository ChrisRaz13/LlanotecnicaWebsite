# Auto-generated by the Firebase CLI, then customized for this repo's
# nested Angular app at `frontend/llanotecnica-frontend/`.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/llanotecnica-frontend/package-lock.json
      - name: Verify required secrets are set
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          missing=()
          [ -z "$FIREBASE_API_KEY" ] && missing+=(FIREBASE_API_KEY)
          [ -z "$GMAPS_API_KEY" ] && missing+=(GMAPS_API_KEY)
          [ -z "$RECAPTCHA_SITE_KEY" ] && missing+=(RECAPTCHA_SITE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - name: Generate environment files from template + secrets
        working-directory: frontend/llanotecnica-frontend
        # See merge workflow for rationale.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          sed \
            -e "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" \
            -e "s|__GMAPS_API_KEY__|${GMAPS_API_KEY}|g" \
            -e "s|__RECAPTCHA_SITE_KEY__|${RECAPTCHA_SITE_KEY}|g" \
            src/environments/environment.prod.template.ts \
            > src/environments/environment.prod.ts
          cp src/environments/environment.prod.ts src/environments/environment.ts
          cp src/environments/environment.prod.ts src/environments/environment.dev.ts
      - name: Install + build (Angular SSG, postbuild lang patch)
        working-directory: frontend/llanotecnica-frontend
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LLANOTECNICA_59A31 }}
          projectId: llanotecnica-59a31
          entryPoint: ./frontend/llanotecnica-frontend
