# Auto-generated by the Firebase CLI, then customized for this repo's
# nested Angular app at `frontend/llanotecnica-frontend/`.
#   - `working-directory` for the build step (no package.json at repo root)
#   - `entryPoint` for the Firebase action (no firebase.json at repo root)
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/llanotecnica-frontend/package-lock.json
      - name: Verify required secrets are set (refuse to deploy with empty keys)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        # Fail-fast guard: better to break CI than to deploy a build with
        # empty API keys (would silently break Maps, reCAPTCHA, contact form
        # on production). Add the secrets at:
        # https://github.com/ChrisRaz13/LlanotecnicaWebsite/settings/secrets/actions
        run: |
          missing=()
          [ -z "$FIREBASE_API_KEY" ] && missing+=(FIREBASE_API_KEY)
          [ -z "$GMAPS_API_KEY" ] && missing+=(GMAPS_API_KEY)
          [ -z "$RECAPTCHA_SITE_KEY" ] && missing+=(RECAPTCHA_SITE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "::error::Add them at https://github.com/ChrisRaz13/LlanotecnicaWebsite/settings/secrets/actions"
            echo "::error::Refusing to deploy a build with empty API keys."
            exit 1
          fi
          echo "All required secrets present."

      - name: Generate environment files from template + secrets
        working-directory: frontend/llanotecnica-frontend
        # The real environment.{ts,prod.ts} files are gitignored. Substitute
        # placeholders in the committed template using GitHub Repository
        # Secrets so the actual API keys never appear in git history.
        # Both files get the SAME generated content — angular.json's
        # fileReplacements swaps environment.ts → environment.prod.ts at
        # production build time, but the source file must exist for module
        # resolution to find it before that swap happens.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          sed \
            -e "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" \
            -e "s|__GMAPS_API_KEY__|${GMAPS_API_KEY}|g" \
            -e "s|__RECAPTCHA_SITE_KEY__|${RECAPTCHA_SITE_KEY}|g" \
            src/environments/environment.prod.template.ts \
            > src/environments/environment.prod.ts
          cp src/environments/environment.prod.ts src/environments/environment.ts
          cp src/environments/environment.prod.ts src/environments/environment.dev.ts
      - name: Install + build (Angular SSG, postbuild lang patch)
        working-directory: frontend/llanotecnica-frontend
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LLANOTECNICA_59A31 }}
          channelId: live
          projectId: llanotecnica-59a31
          entryPoint: ./frontend/llanotecnica-frontend
