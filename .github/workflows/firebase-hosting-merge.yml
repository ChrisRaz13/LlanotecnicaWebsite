# Auto-generated by the Firebase CLI, then customized for this repo's
# nested Angular app at `frontend/llanotecnica-frontend/`.
#   - `working-directory` for the build step (no package.json at repo root)
#   - `entryPoint` for the Firebase action (no firebase.json at repo root)
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/llanotecnica-frontend/package-lock.json
      - name: Install + build (Angular SSG, postbuild lang patch)
        working-directory: frontend/llanotecnica-frontend
        # --legacy-peer-deps: @angular/fire@20.0.1 declares
        # `peer @angular/common@^20.0.0` but this workspace runs Angular v21.
        # The only @angular/fire@21 release is an RC (21.0.0-rc.0); we stay
        # on 20.0.1 stable until a v21 stable lands. Functionally compatible.
        run: npm ci --legacy-peer-deps && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LLANOTECNICA_59A31 }}
          channelId: live
          projectId: llanotecnica-59a31
          entryPoint: ./frontend/llanotecnica-frontend
